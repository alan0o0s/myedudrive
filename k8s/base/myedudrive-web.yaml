apiVersion: v1
kind: Service
metadata:
  # Keep the existing external service name and NodePort to avoid changing
  # Server 1's URL. It now routes directly to the unified Apache/Nextcloud pod.
  name: myedudrive-nginx
  labels:
    app.kubernetes.io/name: myedudrive-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
