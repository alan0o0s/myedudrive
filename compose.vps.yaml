# Single-VPS deployment. Keep secrets.env on the VPS and out of Git.
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in secrets.env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-nextcloud}
      MARIADB_USER: ${MARIADB_USER:-nextcloud}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in secrets.env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  myedudrive:
    image: docker.io/alan0o0s/myedudrive-server:v1.1.2
    pull_policy: always
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: ${MARIADB_DATABASE:-nextcloud}
      MYSQL_USER: ${MARIADB_USER:-nextcloud}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in secrets.env}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in secrets.env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in secrets.env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:?Set NEXTCLOUD_TRUSTED_DOMAINS in secrets.env}
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 1G
    volumes:
      - nextcloud-data:/var/www/html
    ports:
      - "0.0.0.0:${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/status.php') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  mariadb-data:
  redis-data:
  nextcloud-data:
