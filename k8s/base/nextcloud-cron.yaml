apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud-cron
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nextcloud-cron
              image: nextcloud:apache
              imagePullPolicy: Always
              securityContext:
                runAsUser: 33
                runAsGroup: 33
              command: ["sh", "-ec", "for i in $(seq 1 60); do if php /var/www/html/occ status --output=json 2>/dev/null | grep -Eq '\"installed\"[[:space:]]*:[[:space:]]*true'; then exec php -f /var/www/html/cron.php; fi; sleep 10; done; echo 'MyEduDrive is not installed yet' >&2; exit 1"]
              env:
                - name: MYSQL_HOST
                  value: mariadb
                - name: MYSQL_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: myedudrive-secrets
                      key: MARIADB_DATABASE
                - name: MYSQL_USER
                  valueFrom:
                    secretKeyRef:
                      name: myedudrive-secrets
                      key: MARIADB_USER
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: myedudrive-secrets
                      key: MARIADB_PASSWORD
                - name: REDIS_HOST
                  value: redis
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: nextcloud-data
                  mountPath: /var/www/html
          volumes:
            - name: nextcloud-data
              persistentVolumeClaim:
                claimName: nextcloud-data
