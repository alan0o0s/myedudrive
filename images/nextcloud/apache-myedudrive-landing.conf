# Serve the existing static landing page from this same Apache/Nextcloud image.
# Only the exact root and static assets are aliased; login, DAV, APIs, and all
# other Nextcloud routes continue to resolve through /var/www/html.
AliasMatch ^/$ /usr/local/share/myedudrive/landing/index.html
Alias /assets/ /usr/local/share/myedudrive/landing/assets/
Alias /styles.css /usr/local/share/myedudrive/landing/styles.css
Alias /script.js /usr/local/share/myedudrive/landing/script.js

<Directory /usr/local/share/myedudrive/landing>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
